[package]
name = "persea-desktop"
version = "1.2.0"
description = "Persea Desktop: thin client for the Persea remote access server"
authors = ["Persea Contributors"]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/BarbellDwarf/persea-desktop"
homepage = "https://github.com/BarbellDwarf/persea-desktop"
keywords = ["remote-desktop", "guacamole", "persea", "tauri"]
categories = ["command-line-utilities"]

[lib]
name = "persea_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
keyring = { version = "4", default-features = false, features = ["apple-native-keyring-store", "windows-native-keyring-store", "zbus-secret-service-keyring-store", "linux-keyutils-keyring-store", "db-keystore"] }
