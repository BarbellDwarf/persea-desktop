[package]
name = "persea-desktop"
version = "1.0.0"
description = "Persea Desktop: thin client for the Persea remote access server"
authors = ["Persea Contributors"]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/BarbellDwarf/persea-desktop"
homepage = "https://github.com/BarbellDwarf/persea-desktop"
keywords = ["remote-desktop", "guacamole", "persea", "tauri"]
categories = ["command-line-utilities"]

[lib]
name = "persea_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
keyring-core = "1.0.0"
notify-rust = "4"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
core-graphics = "=0.24.0"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
windows = { version = "=0.61.3", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["allow-unsafe-code"] }
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["rt-tokio-crypto-rust"] }
linux-keyutils-keyring-store = "1.0.0"
db-keystore = "0.4.3"
