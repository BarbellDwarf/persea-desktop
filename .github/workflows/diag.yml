name: Diag
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the lib tests
        working-directory: src-tauri
        run: cargo test --lib --no-run

      - name: Run the test exe and capture every diagnostic
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Get-ChildItem target/debug/deps/persea_desktop_lib-*.exe | Select-Object -First 1
          Write-Host "exe: $($exe.FullName)"
          & $exe.FullName 2>&1 | Out-String | Write-Host
          Write-Host "exit code: $LASTEXITCODE"
          Start-Sleep -Seconds 8

          Write-Host "=== WER ReportQueue ==="
          Get-ChildItem 'C:\ProgramData\Microsoft\Windows\WER\ReportQueue' -ErrorAction SilentlyContinue |
            Where-Object Name -match 'persea' | ForEach-Object {
              Write-Host "queue: $($_.FullName)"
              Get-ChildItem $_.FullName | ForEach-Object {
                Write-Host "--- $($_.Name)"
                Get-Content $_.FullName -TotalCount 60 -ErrorAction SilentlyContinue | Out-String | Write-Host
              }
            }

          Write-Host "=== Application event log (unfiltered, last 15) ==="
          Get-WinEvent -LogName Application -MaxEvents 15 -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "---"; Write-Host "$($_.ProviderName) [$($_.Id)]"; Write-Host $_.Message }

          Write-Host "=== import table audit ==="
          python -m pip install --quiet pefile
          python - <<'PYEOF'
          import pefile, os
          exe = r"${{ github.workspace }}\src-tauri\target\debug\deps"
          exe = [os.path.join(exe, f) for f in os.listdir(exe) if f.startswith("persea_desktop_lib") and f.endswith(".exe")][0]
          pe = pefile.PE(exe)
          windir = os.environ.get("WINDIR", "C:\\Windows")
          search = [os.path.dirname(exe), os.path.join(windir, "System32"), os.path.join(windir, "SysWOW64"), windir]
          search += [p for p in os.environ.get("PATH", "").split(";") if p]
          problems = []
          for entry in getattr(pe, "DIRECTORY_ENTRY_IMPORT", []):
              dll = entry.dll.decode()
              cands = [os.path.join(d, dll) for d in search]
              found = next((c for c in cands if os.path.exists(c)), None)
              if not found:
                  problems.append(f"{dll}: DLL NOT FOUND in search path")
                  continue
              try:
                  dpe = pefile.PE(found, fast_load=True)
                  dpe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_EXPORT"]])
                  exports = set()
                  if hasattr(dpe, "DIRECTORY_ENTRY_EXPORT"):
                      for sym in dpe.DIRECTORY_ENTRY_EXPORT.symbols:
                          if sym.name:
                              exports.add(sym.name.decode())
                  for imp in entry.imports:
                      if imp.name and imp.name.decode() not in exports:
                          problems.append(f"{dll}: MISSING EXPORT {imp.name.decode()}")
              except Exception as e:
                  problems.append(f"{dll}: parse error {e}")
          print("PROBLEMS:" if problems else "NO MISSING IMPORTS")
          for pr in problems:
              print(" ", pr)
          PYEOF

          Write-Host "=== embedded manifest check ==="
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          Write-Host ("has <assembly marker: " + ($text -match '<assembly').ToString())
          Write-Host ("has Common-Controls: " + ($text -match 'Common-Controls').ToString())
