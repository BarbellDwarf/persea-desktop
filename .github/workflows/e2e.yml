name: E2E

# Desktop E2E suite: builds the app, provisions a test persea server, and
# drives the real app through tauri-driver. Manual runs also regenerate the
# canonical desktop screenshots and open a PR when the baselines drift.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'shell/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev \
            xvfb guacamole-server openssh-server
          sudo systemctl start guacd || sudo guacd -b 127.0.0.1 &

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the app
        working-directory: src-tauri
        run: cargo build

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Provision the test persea server
        id: server
        run: |
          cd /tmp
          git clone --depth 1 --branch v1.2.0 https://github.com/persea-grove/persea.git
          eval "$(echo "$GITHUB_WORKSPACE/tests/e2e/provision-server.sh /tmp/persea 8099" | tee /tmp/provision.env)"
          grep -E "PERSEA_E2E" /tmp/provision.env >> "$GITHUB_ENV"

      - name: Install the WebDriver client
        working-directory: tests/e2e
        run: npm install

      - name: Run the E2E specs
        working-directory: tests/e2e
        env:
          PERSEA_E2E_BASE_URL: ${{ env.PERSEA_E2E_BASE_URL }}
          PERSEA_E2E_API_KEY: ${{ env.PERSEA_E2E_API_KEY }}
        run: xvfb-run -a node run-specs.js

      - name: Capture the canonical desktop screenshots
        if: github.event_name == 'workflow_dispatch'
        working-directory: tests/e2e
        env:
          PERSEA_E2E_SHOTS: ../../docs/screenshots
          PERSEA_E2E_BASE_URL: ${{ env.PERSEA_E2E_BASE_URL }}
          PERSEA_E2E_API_KEY: ${{ env.PERSEA_E2E_API_KEY }}
        run: xvfb-run -a node run-specs.js

      - name: Open a regeneration PR
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: docs/screenshots
          branch: screenshots/regen
          delete-branch: true
          commit-message: "chore(screenshots): refresh canonical desktop screenshots"
          title: "chore(screenshots): refresh canonical desktop screenshots"
          body: |
            Regenerated from the E2E suite. Review the diff; if the UI change
            was intentional, merge to update the docs.
