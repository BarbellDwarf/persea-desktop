name: Release

# Builds the full desktop artifact matrix for a version tag (v*) and
# publishes it as a GitHub Release. Flow: shared CI gates (ci.yml, the
# same checks that run on every PR) -> a draft release is created once ->
# four build legs upload their bundles -> the publish job un-drafts only
# after every leg succeeded, so a release missing a platform leg can
# never ship.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Gates (check / fmt / clippy / test / audit)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Create draft release
    needs: [checks]
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or reuse the draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --json id --jq .id > /tmp/release-id 2>/dev/null; then
            RELEASE_ID=$(cat /tmp/release-id)
            gh release view "$TAG" --json assets --jq '.assets[].name' |
              while IFS= read -r name; do
                gh release delete-asset "$TAG" "$name" --yes
              done
            gh release edit "$TAG" --draft=true
          else
            RELEASE_ID=$(gh release create "$TAG" --draft --title "Persea Desktop $TAG" --generate-notes --json id --jq .id)
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [checks, prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles msi,nsis
            rust_targets: ""
            binary: src-tauri/target/release/persea-desktop.exe
            smoke: |
              $bin = "src-tauri\target\release\persea-desktop.exe"
              if (!(Test-Path $bin)) { Write-Error "smoke: no binary at $bin"; exit 1 }
              $p = Start-Process -FilePath $bin -PassThru
              Start-Sleep -Seconds 15
              $p.Refresh()
              if ($p.HasExited) { Write-Error "smoke: app exited early (code $($p.ExitCode))"; exit 1 }
              Write-Host "smoke: app alive after 15s"
              Stop-Process -Id $p.Id -Force
          - name: linux
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            rust_targets: ""
            binary: src-tauri/target/release/persea-desktop
            smoke: |
              set -euo pipefail
              BIN="src-tauri/target/release/persea-desktop"
              [ -x "$BIN" ] || { echo "smoke: no binary at $BIN" >&2; exit 1; }
              xvfb-run -a "$BIN" &
              PID=$!
              sleep 15
              if ! kill -0 "$PID" 2>/dev/null; then echo "smoke: app exited early" >&2; exit 1; fi
              echo "smoke: app alive after 15s"
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin
            binary: src-tauri/target/aarch64-apple-darwin/release/persea-desktop
            smoke: |
              set -euo pipefail
              BIN="src-tauri/target/aarch64-apple-darwin/release/persea-desktop"
              [ -x "$BIN" ] || { echo "smoke: no binary at $BIN" >&2; exit 1; }
              "$BIN" &
              PID=$!
              sleep 15
              if ! kill -0 "$PID" 2>/dev/null; then echo "smoke: app exited early" >&2; exit 1; fi
              echo "smoke: app alive after 15s"
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
          - name: macos-x86_64
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            rust_targets: x86_64-apple-darwin
            binary: src-tauri/target/x86_64-apple-darwin/release/persea-desktop
            smoke: |
              set -euo pipefail
              BIN="src-tauri/target/x86_64-apple-darwin/release/persea-desktop"
              [ -x "$BIN" ] || { echo "smoke: no binary at $BIN" >&2; exit 1; }
              "$BIN" &
              PID=$!
              sleep 15
              if ! kill -0 "$PID" 2>/dev/null; then echo "smoke: app exited early" >&2; exit 1; fi
              echo "smoke: app alive after 15s"
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev \
            patchelf xdg-utils libfuse2 xvfb

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.name }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: the private minisign key lives ONLY in the
          # repo secrets; the public key is committed in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          # createUpdaterArtifacts is on in tauri.conf.json; the action
          # uploads latest.json plus every .sig to the release.
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Smoke (app launches, window opens)
        run: ${{ matrix.smoke }}

  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
