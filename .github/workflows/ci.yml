name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: check / fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: fmt
        run: cargo fmt --all --check
        working-directory: src-tauri
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: test (build only)
        run: cargo test --no-run
        working-directory: src-tauri

      - name: Give the windows test binaries a comctl32 v6 manifest
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          # The lib test binary imports comctl32!TaskDialogIndirect, which
          # exists only in comctl32 v6; without a manifest the loader binds
          # System32's v5 and the exe dies with STATUS_ENTRYPOINT_NOT_FOUND.
          # The app binary embeds its manifest via tauri_build — test
          # binaries have none, so drop an external one beside each. This
          # must happen AFTER the link above: cargo's relink replaces the
          # exes and any manifest written before it is stale.
          $manifest = @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*"/>
              </dependentAssembly>
            </dependency>
          </assembly>
          '@
          Get-ChildItem target/debug/deps/*.exe | ForEach-Object {
            # The XML declaration must be the first bytes of the file;
            # the here-string carries YAML indentation, so trim it.
            Set-Content -Path "$($_.FullName).manifest" -Value $manifest.TrimStart()
          }

      - name: test
        run: cargo test
        working-directory: src-tauri

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit
        working-directory: src-tauri
